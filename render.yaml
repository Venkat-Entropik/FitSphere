# Render Blueprint: deploys the backend (backend/Dockerfile) on Render's free web service.
# Data lives in a separate free Postgres database (Neon), so no paid disk or card is needed.
# Dashboard: New → Blueprint → pick this repo. See backend/DEPLOY.md.
services:
  - type: web
    name: fitsphere-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    # Free services sleep after ~15 minutes without traffic; the first request afterwards takes about a minute.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: 'true'
      # Paste the Neon connection string when prompted (required: the server refuses to start without it).
      - key: DATABASE_URL
        sync: false
      # Optional: leave blank to skip. Password-reset email needs RESEND_API_KEY and MAIL_FROM.
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
